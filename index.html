<title>Reading list</title>
<style>
    body {
        background: transparent;
        color: #eee;
        font-family: sans-serif;
        margin: 0;
        padding: 0;
    }
    ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }
    a {
        color: #eee;
    }
</style>
<ul id="list"></ul>
<script>
    const RAINDROP_TOKEN = "PASTE_YOUR_RAINDROP_TOKEN_HERE";

    const listEl = document.getElementById("list");

    fetch(
        "https://api.raindrop.io/rest/v1/raindrops/0?search=%23reading-list",
        {
            headers: {
                Authorization: "Bearer " + RAINDROP_TOKEN,
            },
        },
    )
        .then((res) => {
            if (!res.ok) {
                throw new Error("HTTP " + res.status + " " + res.statusText);
            }
            return res.json();
        })
        .then((data) => {
            const items = data.items || [];
            listEl.innerHTML = items
                .map((item) => {
                    const a = document.createElement("a");
                    a.href = item.link;
                    a.target = "_blank";
                    a.textContent = item.title;
                    const li = document.createElement("li");
                    li.appendChild(a);
                    return li.outerHTML;
                })
                .join("");
        })
        .catch((err) => {
            listEl.textContent = "Error: " + err.message;
        });
</script>
