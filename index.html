<title>Reading list</title>
<style>
    body {
        background: transparent;
        color: #eee;
        font-family:
            -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
    }
    ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }
    li + li {
        margin-top: 10px;
    }
    a {
        color: #eee;
        text-decoration: none;
        font-size: 14px;
        line-height: 1.4;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        transition: opacity 0.15s ease;
    }
    a:hover {
        opacity: 0.75;
        text-decoration: underline;
    }
    #view-all {
        display: block;
        margin-top: 14px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.7;
    }
    h1 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }
</style>
<h1>Reading List</h1>
<ul id="list"></ul>
<a
    id="view-all"
    href="https://app.raindrop.io/my/0/%23reading-list"
    target="_blank"
    >View full list</a
>
<script>
    const RAINDROP_TOKEN = new URLSearchParams(location.hash.slice(1)).get(
        "token",
    );
    history.replaceState(null, "", location.pathname);

    const listEl = document.getElementById("list");

    fetch(
        "https://api.raindrop.io/rest/v1/raindrops/0?search=%23reading-list",
        {
            headers: {
                Authorization: "Bearer " + RAINDROP_TOKEN,
            },
        },
    )
        .then((res) => {
            if (!res.ok) {
                throw new Error("HTTP " + res.status + " " + res.statusText);
            }
            return res.json();
        })
        .then((data) => {
            const items = data.items || [];
            listEl.innerHTML = items
                .map((item) => {
                    const a = document.createElement("a");
                    a.href = item.link;
                    a.target = "_blank";
                    a.textContent = item.title;
                    const li = document.createElement("li");
                    li.appendChild(a);
                    return li.outerHTML;
                })
                .join("");
        })
        .catch((err) => {
            listEl.textContent = "Error: " + err.message;
        });
</script>
